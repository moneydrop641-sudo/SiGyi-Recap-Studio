name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run JavaScript syntax checks
        run: npm run check

      - name: Build web assets
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install Si Gyi native Gemini bridge
        run: npm run android:bridge

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SiGyi-Recap-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
