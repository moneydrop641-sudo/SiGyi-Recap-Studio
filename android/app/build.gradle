plugins { id 'com.android.application' }

android {
    namespace 'com.sigyi.recapstudio'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.sigyi.recapstudio'
        minSdk 24 
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so', '**/libavcodec.so', '**/libavformat.so', '**/libavutil.so', '**/libswscale.so']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}

def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from('../../dist')
    into('src/main/assets/public')
}
def copyCapacitorConfig = tasks.register('copyCapacitorConfig', Copy) {
    from('../../capacitor.config.json')
    into('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn(copyWebAssets, copyCapacitorConfig) }
