plugins { id 'com.android.application' }

android {
    namespace 'com.sigyi.recapstudio'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.sigyi.recapstudio'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.2.0'

        // ✅ သင့်ဖုန်းက 64-bit ဖြစ်တာမို့ native library ကို 64-bit ပဲ သုံးခိုင်းတာပါ
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ✅ Native library တွေ ထပ်နေရင် ပထမတစ်ခုကိုပဲ ယူခိုင်းတာပါ (Crash မဖြစ်စေရန်)
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libavcodec.so'
        pickFirst '**/libavformat.so'
        pickFirst '**/libavutil.so'
        pickFirst '**/libswscale.so'
        pickFirst '**/libswresample.so'
        pickFirst '**/libffmpegkit.so'
        pickFirst '**/libffmpegkit_abidetect.so'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // ✅ FFmpegKit ရဲ့ ပြုပြင်ထိန်းသိမ်းထားတဲ့ ဗားရှင်း
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
}

// Copy Vite output into the Capacitor WebView asset directory before packaging.
def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from('../../dist')
    into('src/main/assets/public')
}
tasks.register('copyCapacitorConfig', Copy) {
    from('../../capacitor.config.json')
    into('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn(copyWebAssets, copyCapacitorConfig) }
